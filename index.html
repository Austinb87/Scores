<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Football Scores Explorer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="img-src https: data:;">

  <style>
    :root {
      color-scheme: dark;
      --bg: #05060a;
      --bg-elevated: #111827;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --text: #e5e7eb;
      --text-muted: #9ca3af;
      --border: #1f2937;
      --card-bg: #020617;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #020617;
      color: var(--text);
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 1200px;
      background: #030712;
      border-radius: 24px;
      border: 1px solid var(--border);
      padding: 24px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-dot {
      width: 10px;
      height: 10px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent);
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pill-toggle {
      display: flex;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
    }

    .pill-toggle button {
      background: transparent;
      border: none;
      padding: 6px 14px;
      border-radius: 999px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .pill-toggle button.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .search-wrapper {
      position: relative;
    }

    .search-wrapper input {
      padding: 8px 32px 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
    }

    .search-icon {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .season-select {
      padding: 8px 12px;
      border-radius: 999px;
      background: #020617;
      border: 1px solid var(--border);
      color: var(--text);
    }

    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--bg-elevated);
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 16px;
    }

    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      max-height: 420px;
      overflow-y: auto;
    }

    .team-card {
      border-radius: 14px;
      padding: 10px;
      cursor: pointer;
      color: white;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .team-card.selected {
      outline: 2px solid var(--accent);
    }

    .team-logo-wrap img {
      width: 40px;
      height: 40px;
    }

    .scores-list {
      max-height: 420px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .score-card {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 12px;
    }

    .score-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      row-gap: 6px;
      column-gap: 12px;
      margin-top: 8px;
    }

    .score-team {
      font-size: 1rem;
    }

    .score-value {
      font-size: 1rem;
      font-weight: 700;
      text-align: right;
    }

    .score-vs {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <h1><span class="logo-dot"></span>Football Scores Explorer</h1>

      <div class="controls">
        <div class="pill-toggle" id="leagueToggle">
          <button data-league="NFL" class="active">NFL</button>
          <button data-league="CFB">CFB</button>
        </div>

        <select id="seasonSelect" class="season-select"></select>

        <div class="search-wrapper">
          <input id="teamSearch" placeholder="Search teams..." />
          <span class="search-icon">⌕</span>
        </div>
      </div>
    </header>

    <main>
      <section class="panel">
        <div class="teams-grid" id="teamsGrid"></div>
      </section>

      <section class="panel">
        <div id="scoresList" class="scores-list"></div>
      </section>
    </main>
  </div>

  <script>
    var TEAMS = [
      { league: "NFL", city: "Buffalo", name: "Bills", abbrev: "BUF", espnTeamId: 2, primaryColor: "#00338D", logoUrl: "https://a.espncdn.com/i/teamlogos/nfl/500/buf.png" },
      { league: "NFL", city: "Kansas City", name: "Chiefs", abbrev: "KC", espnTeamId: 12, primaryColor: "#E31837", logoUrl: "https://a.espncdn.com/i/teamlogos/nfl/500/kc.png" },
      { league: "NFL", city: "Dallas", name: "Cowboys", abbrev: "DAL", espnTeamId: 6, primaryColor: "#003594", logoUrl: "https://a.espncdn.com/i/teamlogos/nfl/500/dal.png" },
      { league: "NFL", city: "San Francisco", name: "49ers", abbrev: "SF", espnTeamId: 25, primaryColor: "#AA0000", logoUrl: "https://a.espncdn.com/i/teamlogos/nfl/500/sf.png" },
      { league: "NFL", city: "Philadelphia", name: "Eagles", abbrev: "PHI", espnTeamId: 21, primaryColor: "#004C54", logoUrl: "https://a.espncdn.com/i/teamlogos/nfl/500/phi.png" },

      { league: "CFB", city: "Baton Rouge", name: "LSU Tigers", abbrev: "LSU", espnTeamId: 99, primaryColor: "#461D7C", logoUrl: "https://a.espncdn.com/i/teamlogos/ncaa/500/99.png" },
      { league: "CFB", city: "Tuscaloosa", name: "Alabama Crimson Tide", abbrev: "ALA", espnTeamId: 333, primaryColor: "#9E1B32", logoUrl: "https://a.espncdn.com/i/teamlogos/ncaa/500/333.png" },
      { league: "CFB", city: "Columbus", name: "Ohio State Buckeyes", abbrev: "OSU", espnTeamId: 194, primaryColor: "#BB0000", logoUrl: "https://a.espncdn.com/i/teamlogos/ncaa/500/194.png" },
      { league: "CFB", city: "Ann Arbor", name: "Michigan Wolverines", abbrev: "MICH", espnTeamId: 130, primaryColor: "#00274C", logoUrl: "https://a.espncdn.com/i/teamlogos/ncaa/500/130.png" },
      { league: "CFB", city: "Athens", name: "Georgia Bulldogs", abbrev: "UGA", espnTeamId: 61, primaryColor: "#BA0C2F", logoUrl: "https://a.espncdn.com/i/teamlogos/ncaa/500/61.png" }
    ];

    var currentLeague = "NFL";
    var selectedTeam = null;

    var leagueToggle = document.getElementById("leagueToggle");
    var seasonSelect = document.getElementById("seasonSelect");
    var teamSearch = document.getElementById("teamSearch");
    var teamsGrid = document.getElementById("teamsGrid");
    var scoresList = document.getElementById("scoresList");

    function detectFootballSeason() {
      var now = new Date();
      var year = now.getFullYear();
      var month = now.getMonth() + 1;
      return month >= 8 ? year : year - 1;
    }

    function generateSeasonOptions() {
      var currentSeason = detectFootballSeason();
      var seasons = [];
      for (var i = 0; i < 5; i++) {
        seasons.push(currentSeason - i);
      }
      return seasons;
    }

    function populateSeasonDropdown() {
      var seasons = generateSeasonOptions();
      seasonSelect.innerHTML = "";
      for (var i = 0; i < seasons.length; i++) {
        var season = seasons[i];
        var opt = document.createElement("option");
        opt.value = season;
        opt.textContent = season;
        seasonSelect.appendChild(opt);
      }
      seasonSelect.value = detectFootballSeason();
    }

    populateSeasonDropdown();

    function renderTeams() {
      teamsGrid.innerHTML = "";
      var search = teamSearch.value.toLowerCase();

      var filtered = TEAMS.filter(function (t) {
        return t.league === currentLeague &&
          (t.city + " " + t.name).toLowerCase().indexOf(search) !== -1;
      });

      filtered.sort(function (a, b) {
        var aKey = a.city + a.name;
        var bKey = b.city + b.name;
        return aKey.localeCompare(bKey);
      });

      filtered.forEach(function (team) {
        var card = document.createElement("div");
        card.className = "team-card";
        card.style.background = team.primaryColor;

        card.innerHTML = `
          <div class="team-logo-wrap">
            <img src="${team.logoUrl}">
          </div>
          <div>${team.city}</div>
          <div><strong>${team.name}</strong></div>
        `;

        card.onclick = function () {
          selectTeam(team);
        };

        if (selectedTeam && selectedTeam.abbrev === team.abbrev) {
          card.classList.add("selected");
        }

        teamsGrid.appendChild(card);
      });
    }

    function selectTeam(team) {
      selectedTeam = team;
      renderTeams();
      loadScores(team);
    }

    function safeScore(scoreObj) {
      if (!scoreObj) return "0";
      if (typeof scoreObj === "string" || typeof scoreObj === "number") return scoreObj;
      if (scoreObj.value !== undefined) return scoreObj.value;
      return "0";
    }

    function loadScores(team) {
      scoresList.innerHTML = "Loading…";

      var season = seasonSelect.value;
      var leaguePath = team.league === "NFL" ? "nfl" : "college-football";

      var url = "https://site.api.espn.com/apis/site/v2/sports/football/" +
        leaguePath + "/teams/" + team.espnTeamId + "/schedule?season=" + season;

      fetch(url)
        .then(function (res) { return res.json(); })
        .then(function (data) {
          var events = data && data.events ? data.events : [];
          if (!events.length) {
            scoresList.innerHTML = "No games found for this season.";
            return;
          }

          scoresList.innerHTML = "";

          events.forEach(function (ev) {
            var comp = ev.competitions && ev.competitions[0] ? ev.competitions[0] : null;
            if (!comp || !comp.competitors) return;

            var home = comp.competitors.find(function (c) { return c.homeAway === "home"; });
            var away = comp.competitors.find(function (c) { return c.homeAway === "away"; });
            if (!home || !away) return;

            var homeScore = safeScore(home.score);
            var awayScore = safeScore(away.score);

            var weekText = ev.week && ev.week.text ? ev.week.text : "Week";
            var dateText = ev.date ? new Date(ev.date).toLocaleDateString() : "";

            var card = document.createElement("div");
            card.className = "score-card";

            card.innerHTML = `
              <div><strong>${weekText}</strong> — ${dateText}</div>

              <div class="score-grid">
                <div class="score-team">${away.team.displayName}</div>
                <div class="score-value">${awayScore}</div>

                <div class="score-team">${home.team.displayName}</div>
                <div class="score-value">${homeScore}</div>
              </div>

              <div class="score-vs">${away.team.displayName} @ ${home.team.displayName}</div>
            `;

            scoresList.appendChild(card);
          });
        })
        .catch(function () {
          scoresList.innerHTML = "Error loading scores.";
        });
    }

    leagueToggle.onclick = function (e) {
      var btn = e.target.closest("button");
      if (!btn) return;
      currentLeague = btn.dataset.league;
      Array.prototype.forEach.call(leagueToggle.children, function (b) {
        b.classList.remove("active");
      });
      btn.classList.add("active");
      selectedTeam = null;
      scoresList.innerHTML = "";
      renderTeams();
    };

    seasonSelect.onchange = function () {
      if (selectedTeam) loadScores(selectedTeam);
    };

    teamSearch.oninput = renderTeams;

    renderTeams();
  </script>
</body>
</html>
