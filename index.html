<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scores - Football</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="img-src https: data:;">

  <style>
    :root {
      color-scheme: dark;
      --bg: #05060a;
      --bg-elevated: #111827;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --text: #e5e7eb;
      --text-muted: #9ca3af;
      --border: #1f2937;
      --card-bg: #020617;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #020617;
      color: var(--text);
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 1200px;
      background: #030712;
      border-radius: 24px;
      border: 1px solid var(--border);
      padding: 24px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-dot {
      width: 10px;
      height: 10px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent);
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pill-toggle {
      display: flex;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
    }

    .pill-toggle button {
      background: transparent;
      border: none;
      padding: 6px 14px;
      border-radius: 999px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .pill-toggle button.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .search-wrapper {
      position: relative;
    }

    .search-wrapper input {
      padding: 8px 32px 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
    }

    .search-icon {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .season-select {
      padding: 8px 12px;
      border-radius: 999px;
      background: #020617;
      border: 1px solid var(--border);
      color: var(--text);
    }

    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--bg-elevated);
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 16px;
    }

    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      max-height: 420px;
      overflow-y: auto;
    }

    .team-card {
      border-radius: 14px;
      padding: 10px;
      cursor: pointer;
      color: white;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .team-card.selected {
      outline: 2px solid var(--accent);
    }

    .team-logo-wrap img {
      width: 40px;
      height: 40px;
    }

    .scores-list {
      max-height: 420px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .score-card {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 12px;
    }

    .score-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      row-gap: 6px;
      column-gap: 12px;
      margin-top: 8px;
    }

    .score-team {
      font-size: 1rem;
    }

    .score-value {
      font-size: 1rem;
      font-weight: 700;
      text-align: right;
    }

    .score-vs {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <h1><span class="logo-dot"></span>Football Scores Explorer</h1>

      <div class="controls">
        <div class="pill-toggle" id="leagueToggle">
          <button data-league="NFL" class="active">NFL</button>
          <button data-league="CFB">CFB</button>
        </div>

        <select id="seasonSelect" class="season-select"></select>

        <div class="search-wrapper">
          <input id="teamSearch" placeholder="Search teams..." />
          <span class="search-icon">⌕</span>
        </div>
      </div>
    </header>

    <main>
      <section class="panel">
        <div class="teams-grid" id="teamsGrid"></div>
      </section>

      <section class="panel">
        <div id="scoresList" class="scores-list"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
